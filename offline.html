<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e6973">
  <meta name="robots" content="noindex">
  <title>Offline | RIVAYAT</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{align-items:center;background:#f5f4ee;color:#102a2c;display:grid;margin:0;min-height:100vh;padding:24px}.card{background:#fffdf8;border:1px solid rgba(14,105,115,.16);border-radius:30px;box-shadow:0 24px 80px rgba(14,54,60,.14);margin:auto;max-width:620px;padding:clamp(32px,7vw,64px);text-align:center}.mark{align-items:center;background:#0e6973;border-radius:50%;color:#f2bb16;display:flex;font-size:42px;font-weight:900;height:96px;justify-content:center;margin:0 auto 24px;width:96px}h1{font-size:clamp(46px,10vw,78px);letter-spacing:-.065em;line-height:.9;margin:0}p{color:#6d7775;line-height:1.7;margin:22px auto;max-width:460px}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}a,button{background:#102a2c;border:1px solid #102a2c;border-radius:999px;color:#fffdf8;font:700 11px Inter,system-ui;padding:14px 20px;text-decoration:none;text-transform:uppercase}button{background:transparent;color:#102a2c}@media(prefers-color-scheme:dark){body{background:#071f23;color:#edf7f3}.card{background:#0b2a2e}.mark{background:#bad9ce;color:#102a2c}p{color:#a9bcb8}a{background:#edf7f3;color:#071f23}button{border-color:#edf7f3;color:#edf7f3}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">R</div>
    <h1>You are offline.</h1>
    <p>Saved Rivayat pages and products remain available. Reconnect to sign in, verify a PIN code, place an order, submit a review or sync account changes.</p>
    <div class="actions"><a href="/">Browse saved store</a><button type="button" onclick="location.reload()">Try again</button></div>
  </main>
</body>
</html>
